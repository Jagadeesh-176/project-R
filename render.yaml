# Render Blueprint for the backend. Deploy via the Render dashboard:
# New -> Blueprint -> pick this repo -> Render reads this file automatically.
#
# The frontend is NOT deployed from this file — it goes to Vercel separately
# (see frontend/vercel.json and the README's Deployment section).
services:
  - type: web
    name: rag-app-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # Set the real value in the Render dashboard after the first deploy —
      # "sync: false" means Render will prompt for it instead of reading it
      # from this file, so the key itself never has to be committed.
      - key: GOOGLE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.10
